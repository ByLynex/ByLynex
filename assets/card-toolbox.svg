<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="190" viewBox="0 0 600 190">
  <defs>
    <radialGradient id="g" cx="12%" cy="0%" r="90%">
      <stop offset="0" stop-color="rgb(209,122,63)" stop-opacity="0.32"/>
      <stop offset="1" stop-color="rgb(209,122,63)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgb(209,122,63)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="rgb(209,122,63)" stop-opacity="0.9"/>
      <stop offset="1" stop-color="rgb(209,122,63)" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ic"><rect x="32" y="34" width="72" height="72" rx="18"/></clipPath>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .glow { animation: breathe 6s ease-in-out infinite; }
      .dot { animation: blink 2s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    </style>
  </defs>
  <rect width="600" height="190" rx="18" fill="#111113"/>
  <rect class="glow" width="600" height="190" rx="18" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="599" height="189" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <rect x="120" y="0" width="360" height="1.5" fill="url(#edge)"/>
  <rect x="31" y="33" width="74" height="74" rx="19" fill="none" stroke="rgb(209,122,63)" stroke-opacity="0.45"/>
  <image x="32" y="34" width="72" height="72" clip-path="url(#ic)" xlink:href="data:image/png;base64,"/>
  <g class="t">
    <text x="128" y="66" fill="#ffffff" font-size="26" font-weight="700" letter-spacing="-0.5">Toolbox</text>
    <rect x="128" y="80" width="124" height="24" rx="12" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.35"/>
    <circle class="dot" cx="141" cy="92" r="3.5" fill="#fbbf24"/>
    <text x="151" y="96.5" fill="#fbbf24" font-size="12.5" font-weight="600">In development</text>
    <text x="32" y="146" fill="#d4d4d8" font-size="16">Handy little tools for everyday</text>
    <text x="32" y="168" fill="#a1a1aa" font-size="16">tasks, right in your browser.</text>
    <text x="568" y="66" text-anchor="end" fill="#ffffff" fill-opacity="0.5" font-size="20">↗</text>
  </g>
</svg>
