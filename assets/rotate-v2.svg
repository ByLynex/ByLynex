<svg xmlns="http://www.w3.org/2000/svg" width="300" height="40" viewBox="0 0 300 40">
  <style>.t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.w0{opacity:0;animation:r 10.4s ease-in-out infinite;animation-delay:-10.40s}.w1{opacity:0;animation:r 10.4s ease-in-out infinite;animation-delay:-7.80s}.w2{opacity:0;animation:r 10.4s ease-in-out infinite;animation-delay:-5.20s}.w3{opacity:0;animation:r 10.4s ease-in-out infinite;animation-delay:-2.60s}@keyframes r{0%{opacity:0;transform:translateY(10px)}3.00%{opacity:1;transform:translateY(0)}22.00%{opacity:1;transform:translateY(0)}25.00%{opacity:0;transform:translateY(-10px)}100%{opacity:0;transform:translateY(-10px)}}</style>
  <g class="t"><text x="0" y="28" fill="#c9d1d9" font-size="22" font-weight="600">Ich baue</text>
  <g transform="translate(100 0)"><text class="w0" x="0" y="28" fill="#409cd1" font-size="22" font-weight="700">Websites</text><text class="w1" x="0" y="28" fill="#409cd1" font-size="22" font-weight="700">Web-Apps</text><text class="w2" x="0" y="28" fill="#409cd1" font-size="22" font-weight="700">Desktop-Tools</text><text class="w3" x="0" y="28" fill="#409cd1" font-size="22" font-weight="700">Discord-Bots</text></g></g>
</svg>
